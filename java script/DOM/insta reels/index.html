<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
             <div class="all-reels">
                <div class="reel">
                   <video autoplay loop muted src="./reels/reel1.mp4"></video>
                    <div class="bottom">
                       <div class="user">
                         <img src="https://images.unsplash.com/photo-1783003530096-c17dff6b63b1?q=80&w=685&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                          <h4>Swingreels</h4>
                          <button>Follow</button>
                        </div>
                           <div class="caption"><p>☁️ Just swing and smile.</p></div>
                    </div>
                    <div class="right">
                       <div class="like"> 
                        <h4 ><i class="ri-heart-3-line"></i></h4>
                        <h2>400</h2>
                      </div>
                       <div class="comment">
                         <h4><i class="ri-chat-1-line"></i></h4>
                        <h2>50</h2>
                    </div>
                       <div class="share">
                        <h4><i class="ri-share-line"></i></h4>
                        <h2>30</h2>
                    </div>
                       <div class="menu"> <h4><i class="ri-more-2-fill"></i></h4></div>
                    </div>
                </div>
            </div>
        </section>

        
    </main>
    
    <script src="script.js"></script>
</body>
</html>
