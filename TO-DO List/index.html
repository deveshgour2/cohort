<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <main>
        <nav>
            <div class="left">
                <img src="./images/checklist-icon-svg-download-png-10582460.webp" alt="">
                <div class="content">
                    <h3>TO-DO LIST</h3>
                    <p>Engineerign Task Workspace</p>
                </div>
            </div>
            <div class="right">
                <p class="remaining">2</p>
                <p>tasks remaining</p>
            </div>
        </nav>

        <section class="AddTask">
            <input type="text" placeholder="Enter your task here">
            <button>Add Task</button>
        </section>

        <section class="taskbar">
            <div class="left-taskbar">
                <p>All</p>
                <p>Active</p>
                <p>Completed</p>
            </div>

            <div class="right-taskbar">
                <p>Clear Completed</p>
            </div>
        </section>

        <section class="tasklist">
            <div class="task">

            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
